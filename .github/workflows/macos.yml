name: macOS build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app (arm64 + x86_64)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          chmod +x macos/build.sh
          ./macos/build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: macos/build/*.zip

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" macos/build/*.zip --clobber
